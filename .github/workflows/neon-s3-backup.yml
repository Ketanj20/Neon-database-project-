name: Neon Primary S3 Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws
          aws-region: us-east-2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Backup Neon
        env:
          DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          TS=$(date -u +"%Y-%m-%dT%H-%M-%SZ")

          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="neon-primary-${TS}.dump"

          aws s3 cp \
            "neon-primary-${TS}.dump" \
            "s3://${S3_BUCKET}/neon-dr/primary/neon-primary-${TS}.dump"



          aws s3 ls \
            "s3://${S3_BUCKET}/neon-dr/primary/"

          rm -f "neon-primary-${TS}.dump"
